# Deploy css-art static content to GitHub Pages
name: Deploy CSS Art to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "css-art/**"
      - ".github/workflows/deploy-css-art-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-css-art"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create / enable Pages if the repo does not have it yet
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "css-art"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
